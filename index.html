<title>Pupu's World</title>
<meta name="description" content="Pupu's World (পুপুর জগৎ): a hand-drawn Bengali folk-art (Rongpat) platformer about a boy, his cat and the memories of his Dadu. Plays in the browser on PC and phone, in English or Bangla.">
<meta property="og:title" content="Pupu's World · পুপুর জগৎ"><meta property="og:description" content="A Rongpat-style story platformer about a boy, his talking cat and his Dadu's ten lost things."><meta property="og:image" content="assets/screenshots/01-title.png">

<style>
/* Layout: one 16:9 paper-theatre stage letterboxed on night indigo; touch buttons float over the stage corners on phones. */
:root{
  --night:#0B0D1F; --ink:#1C1410; --paper:#F3E6C8; --sindoor:#C8341F; --turmeric:#E3A92B; --teal:#1F7A78;
  --display:'Rozha One', Georgia, serif;
  --body:'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--paper);font-family:var(--body);
  overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#wrap{height:100%;display:grid;place-items:center}
#stage{position:relative;max-width:100%}
#c{display:block;width:100%;height:100%;border-radius:6px;outline:none}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
body.touch #touch{display:block}
.btn{
  --b:clamp(46px, 14vh, 74px);
  position:absolute;width:var(--b);height:var(--b);border-radius:50%;
  background:rgba(243,230,200,.14);border:2.5px solid rgba(243,230,200,.6);
  color:var(--paper);font:700 clamp(10px,2.4vh,13px)/1 var(--body);letter-spacing:.06em;
  display:grid;place-items:center;pointer-events:auto;touch-action:none;padding:0;
}
.btn.on{background:rgba(227,169,43,.5);border-color:var(--turmeric)}
.btn.ready{background:rgba(227,169,43,.55);border-color:var(--turmeric);color:var(--ink);animation:useGlow 1s ease-in-out infinite}
@keyframes useGlow{0%,100%{box-shadow:0 0 6px 2px rgba(227,169,43,.55)}50%{box-shadow:0 0 22px 8px rgba(227,169,43,.9)}}
@media (prefers-reduced-motion: reduce){.btn.ready{animation:none;box-shadow:0 0 14px 5px rgba(227,169,43,.8)}}
.btn svg{width:46%;height:46%}
#joy{--j:clamp(112px,36vh,176px);position:absolute;left:18px;bottom:14px;width:var(--j);height:var(--j);border-radius:50%;background:rgba(243,230,200,.12);border:2.5px solid rgba(243,230,200,.55);pointer-events:auto;touch-action:none}
#joyRing{position:absolute;inset:22%;border-radius:50%;border:1.5px dashed rgba(243,230,200,.3);pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(243,230,200,.5);border:2.5px solid rgba(243,230,200,.85);box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
#joy.on #joyKnob{background:rgba(227,169,43,.6);border-color:var(--turmeric)}
#joy.run #joyKnob{background:rgba(227,120,43,.85);border-color:#FFD38A}
.ja{position:absolute;color:rgba(243,230,200,.55);font:700 clamp(10px,2.6vh,14px)/1 var(--body);pointer-events:none}
.jl{left:7%;top:50%;transform:translateY(-50%)}.jr{right:7%;top:50%;transform:translateY(-50%)}
.ju{top:6%;left:50%;transform:translateX(-50%)}.jd{bottom:6%;left:50%;transform:translateX(-50%)}
#touch:not(.depth) .ju,#touch:not(.depth) .jd{display:none}
#touch:not(.use) #bU{display:none}
#touch.minigame #joy{display:none}
#touch.hideall{display:none!important}
#touch.knobjoy .btn{display:none!important}
#touch.menu #joy,#touch.menu .btn:not(.small),#touch.menu #bP{display:none}
#bJ{right:12px;bottom:12px;--b:clamp(54px,17vh,86px)}
#bS{right:calc(24px + clamp(54px,17vh,86px));bottom:12px}
#bU{right:22px;bottom:calc(24px + clamp(54px,17vh,86px))}
.small{--b:clamp(34px,9vh,44px);top:10px;bottom:auto}
#bP{right:10px}
#touch.minigame .btn:not(.small){display:none}
#touch.surprise #joy,#touch.surprise .btn:not(.small){display:none}
#bM{right:calc(20px + clamp(34px,9vh,44px))}
#bF{right:calc(30px + 2 * clamp(34px,9vh,44px))}
/* phones: no side gutter, fill the whole dynamic viewport */
body.touch{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@supports (height:100dvh){html,body{height:100dvh}}
:fullscreen body,body:fullscreen{padding:0}
#rotate{position:fixed;inset:0;z-index:5;background:var(--night);display:none;place-items:center;text-align:center;padding:24px;font-size:18px;line-height:1.5}
#rotate b{font-family:var(--display);font-size:28px;color:var(--turmeric);font-weight:400;display:block}
body.portrait.touch #rotate{display:grid}
.btn:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="Pupu's World game. Prologue: Midnight TV"></canvas>
    <div id="touch">
      <div id="joy" aria-label="Joystick: move; push all the way to run"><span class="ja jl">◀</span><span class="ja jr">▶</span><span class="ja ju">▲</span><span class="ja jd">▼</span><div id="joyRing"></div><div id="joyKnob"></div></div>
      <button class="btn" id="bS" aria-label="Sneak (hold)">SNEAK</button>
      <button class="btn" id="bJ" aria-label="Jump">JUMP</button>
      <button class="btn" id="bU" aria-label="Use or hide">USE</button>
      <button class="btn small" id="bP" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
      <button class="btn small" id="bF" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn small" id="bM" aria-label="Sound on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    </div>
  </div>
</div>
<div id="rotate"><div><b>Turn your phone sideways</b>ফোনটা আড়াআড়ি ধরো<br>Pupu's World plays in landscape.</div></div>

<script>
(() => {
'use strict';
// ================= constants =================
// Scale: 110 px = 1 metre. Pupu is 1.3 m, Ma 1.6 m, ceilings 3 m.
const W = 960, H = 540;
const UP = 400, GF = 760, CEIL_U = 70, CEIL_G = 430;
let WW = 2700, WH = 840; // set per level

const SEATS = [{x:572, y:350, floor:UP, face:-1, name:'chair'}, {x:770, y:710, floor:GF, face:1, name:'chair'}, {x:1065, y:710, floor:GF, face:-1, name:'chair'},
  {x:417, y:710, floor:GF, face:-1, name:'sofa', front:true}];

const GH_SEATS = [{x:1202, y:742, floor:780, face:1, name:'bench', front:true}];   // the bench in the ghat shed
const STAIR_TOP = {x:1900, y:UP}, STAIR_BOT = {x:2440, y:GF}, MA_DOOR = {x:1100, y:UP};
const PRO_WW = 4100;   // the house is 30..2670; the verandah outside Pupu's room is its own strip at 2980..4040 (reached through his verandah door)
const PV = {x0: 2980, x1: 4040, door: 3070, seat: 3930}, ROOM_VDOOR = {x0: 655, x1: 775};
const CAT_SHELF = {x0: 1296, x1: 1404}, CAT_BOWL = 2088, CAT_WAKE = 2075, CAT_FEED = 2142;   // Mishti's corner beside the stairs
const SP = 1.95, SM = 1.6;
// Ma's sari colours (peacock-blue sari, turmeric border, maroon blouse)
const MA_SARI = '#2E6E9E', MA_BORDER = '#E3A92B', MA_BLOUSE = '#7A1F2A', MA_MOTIF = '#F3E6C8';
// Pupu's clothes: plain red T-shirt, indigo shorts
const PUPU_SHIRT = '#D2402E', PUPU_DOTS = '#FBF5E9', PUPU_PANTS = '#2C3E8C';
const PUPU_GLOW = false; // the soft light around Pupu (off for now, to compare) // character draw scales
const INK = '#1C1410', PAPER = '#F3E6C8', CREAM = '#FBF5E9', SINDOOR = '#C8341F', TURMERIC = '#E3A92B',
      TEAL = '#1F7A78', INDIGO = '#2C3E8C', CLAY = '#B5482A', SKIN = '#B9774A', MASKIN = '#C99A72', WOOD = '#7A4626', WOOD2 = '#5A3018', PINK = '#E58BA0', LEAF = '#3E8A3A';

const dispFont = "'Rozha One', Georgia, serif";

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const lc = document.createElement('canvas'), lx = lc.getContext('2d');
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let K = 1, LS = 1;

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const s = Math.max(0.2, Math.min(w / W, h / H));
  stage.style.width = (W * s) + 'px'; stage.style.height = (H * s) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  K = s * dpr;
  for (const c of [canvas, lc]) { c.width = Math.round(W * K); c.height = Math.round(H * K); }
  document.body.classList.toggle('portrait', window.innerHeight > window.innerWidth);
}
window.addEventListener('resize', resize); resize();
// full screen: phones go full screen (and landscape) on the first tap; the [⛶] button or F key toggles it
const fsEl = document.documentElement;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function goFull() {
  try {
    const r = fsEl.requestFullscreen ? fsEl.requestFullscreen({navigationUI: 'hide'}) : fsEl.webkitRequestFullscreen ? fsEl.webkitRequestFullscreen() : null;
    Promise.resolve(r).then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} }).catch(() => {});
  } catch (_) {}
}
function toggleFull() {
  if (fsOn()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (_) {} }
  else { goFull(); setTimeout(() => { if (!fsOn() && typeof showToast === 'function') showToast(isTouch ? 'Full screen is blocked here. Open the game in your browser, or use Add to Home Screen.' : 'Full screen is blocked here. Open the game in its own tab.'); }, 600); }
}
// inside the Android app the screen is already full: no button, no request
const inApp = location.href.indexOf('file:///android_asset') === 0;
if (inApp) { const fb0 = document.getElementById('bF'); if (fb0) fb0.style.display = 'none'; }
if (isTouch && !inApp) window.addEventListener('pointerdown', function first() { window.removeEventListener('pointerdown', first, true); if (!fsOn()) goFull(); }, {capture: true});
document.addEventListener('fullscreenchange', () => setTimeout(resize, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 60));
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
window.addEventListener('keydown', e => { if (e.code === 'KeyF' && !e.repeat) toggleFull(); });
{ const fb = document.getElementById('bF'); fb.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleFull(); }); fb.addEventListener('contextmenu', e => e.preventDefault()); }

// ================= input =================
const held = {}, edges = {};
const KM = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',KeyK:'jump',   // W/S and ↑/↓ do nothing in the flat levels; in Chapter 2 (depth) they walk into / out of the room (kmap)
 
  ShiftLeft:'sprint',ShiftRight:'sprint',KeyC:'sneak',KeyE:'use',Enter:'use',KeyR:'act',KeyJ:'use',KeyP:'pause',Escape:'pause',KeyM:'mute',KeyQ:'menu',Digit1:'ch1',Numpad1:'ch1',Digit2:'ch2',Digit3:'ch3',Numpad2:'ch2'};
const kmap = c => (typeof G !== 'undefined' && G && (G.level === 'anko' || G.level === 'prologue' || inLab()) && ['KeyW', 'ArrowUp', 'KeyS', 'ArrowDown'].includes(c)) ? (c === 'KeyW' || c === 'ArrowUp' ? 'up' : 'down') : KM[c];   // Chapter 2: up/down = walk deeper / nearer
window.addEventListener('keydown', e => { const a = kmap(e.code); if (!a) return; e.preventDefault(); if (!held[a]) edges[a] = true; held[a] = true; audioInit(); });
window.addEventListener('keyup', e => { const a = kmap(e.code); if (a) held[a] = false; if (KM[e.code]) held[KM[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; });
function bindBtn(id, action) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); audioInit(); if (!held[action]) edges[action] = true; held[action] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = e => { e.preventDefault(); held[action] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn('bS','sneak');
// phone joystick: push a little = walk, push all the way left/right = run; up/down only in levels with depth (else ignored, the knob still moves)
let joyRun = false, joyVec = {x: 0, y: 0}, joyTurn = 0, joyLastA = null;   // (v266) the raw joystick vector (the radio knob is turned by circling it)
(() => { const el = document.getElementById('joy'), knob = document.getElementById('joyKnob'); if (!el) return; let pid = null;
  const setH = (a, v) => { if (v && !held[a]) edges[a] = true; held[a] = v; };
  const apply = (dx, dy) => {   // dx, dy in -1..1
    const dp = typeof G !== 'undefined' && G && (G.level === 'anko' || G.level === 'prologue' || inLab());
    setH('left', dx < -0.28); setH('right', dx > 0.28);
    setH('up', dp && dy < -0.45); setH('down', dp && dy > 0.45);
    joyRun = Math.abs(dx) > 0.82; joyVec.x = dx; joyVec.y = dy;
    if (Math.hypot(dx, dy) > 0.45) { const a = Math.atan2(dy, dx); if (joyLastA !== null) { let d = a - joyLastA; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; if (Math.abs(d) < 2.4) joyTurn += d; } joyLastA = a; } else joyLastA = null;   // (v266) how far the stick has been circled
    const r = el.clientWidth * 0.36; knob.style.transform = 'translate(' + dx * r + 'px,' + dy * r + 'px)';
    el.classList.toggle('on', pid !== null); el.classList.toggle('run', joyRun);
  };
  const move = e => { const b = el.getBoundingClientRect(), R = b.width * 0.36; let dx = (e.clientX - b.left - b.width / 2) / R, dy = (e.clientY - b.top - b.height / 2) / R; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } apply(dx, dy); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (_) {} move(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) { e.preventDefault(); move(e); } });
  const end = e => { if (e.pointerId !== pid) return; pid = null; apply(0, 0); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault()); })();
let runOn = false; // phone RUN is a toggle (hard to hold several buttons at once)
function setRun(v) { runOn = v; const el = document.getElementById('bRun'); if (el) el.classList.toggle('on', v); } bindBtn('bJ','jump'); bindBtn('bU','use'); bindBtn('bP','pause'); bindBtn('bM','mute');
let tapX = 0, tapY = 0, ptrX = 0, ptrY = 0, ptrMoves = [], ptrDown = false;   // (v262) pointer path, for drawing circles round the radio knob
canvas.addEventListener('pointermove', e => { const r = canvas.getBoundingClientRect(); ptrX = (e.clientX - r.left) / r.width * W; ptrY = (e.clientY - r.top) / r.height * H; if (ptrMoves.length < 200) ptrMoves.push([ptrX, ptrY]); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, () => { ptrDown = false; }));
canvas.addEventListener('pointerdown', e => { ptrDown = true; const r = canvas.getBoundingClientRect(); ptrX = (e.clientX - r.left) / r.width * W; ptrY = (e.clientY - r.top) / r.height * H; ptrMoves.length = 0; ptrMoves.push([ptrX, ptrY]); });
const menuKeyQ = [];   // raw keys for the title menus (arrows work here even outside the depth levels)
window.addEventListener('keydown', e => { if (typeof G !== 'undefined' && G && G.state === 'title') { menuKeyQ.push(e.code); if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault(); } });
canvas.addEventListener('pointermove', e => { if (isTouch || typeof G === 'undefined' || !G || G.state !== 'title') return; const r = canvas.getBoundingClientRect(); const h = menuHit((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); if (h >= 0) G.menuSel = h; });

let LANG = (() => { try { return localStorage.getItem('pupuLang') === 'bn' ? 'bn' : 'en'; } catch (_) { return 'en'; } })();
const L2 = (bn, en) => LANG === 'bn' ? (bn || en) : (en || bn);
const HASBN = /[ঀ-৿]/;
const TR = {
  "Spotted!": "ধরা পড়ে গেলে!", "Too hot!": "খুব গরম!", "Squashed!": "চ্যাপ্টা!", "Zap!": "ঝিঁৎ!", "You fell!": "পড়ে গেলে!", "Spotted! That eye can't see through everything…": "ধরা পড়ে গেলে! চোখটা কিন্তু সবকিছু ভেদ করে দেখতে পায় না…", "Too hot! Watch the flame's colour…": "খুব গরম! আগুনের রংটা খেয়াল করো…", "Squashed! It always pauses at the top…": "চ্যাপ্টা! যন্ত্রটা ওপরে উঠে প্রতিবার একটু থামে…", "Zap! Listen to the gate…": "ঝিঁৎ! গেটটার শব্দ শোনো…", "You fell! Something keeps coming back across the gap…": "পড়ে গেলে! ফাঁকটার ওপর দিয়ে কিছু একটা বারবার ফিরে আসে…", "Zap! Those sparks stay close to the floor…": "ঝিঁৎ! ফুলকিগুলো মেঝের কাছাকাছিই থাকে…", "Spotted! Crouch behind a crate when the red beam comes.": "ধরা পড়লে! লাল আলো এলে বাক্সের পেছনে বসে পড়ো।", "Squashed! Run under when the press goes up.": "চ্যাপ্টা! যন্ত্রটা ওপরে উঠলে নিচ দিয়ে দৌড়াও।",
  "Zap! Cross when the electric gate is off.": "ঝিঁৎ! বিজলি-গেট নিভলে পার হও।", "You fell! Ride the moving platform across.": "পড়ে গেলে! চলন্ত তক্তায় চড়ে পার হও।",

  "Ma caught you! Downstairs you can walk, but never run. If Ma comes down, hide with [E] (under the stairs, under the dining table).": "মা ধরে ফেলেছেন! নিচতলায় হাঁটা যায়, কিন্তু দৌড়ানো না। মা নামলে [E] চেপে লুকাও (সিঁড়ির নিচে, খাবার টেবিলের নিচে)।",

let AC = null, master = null, muted = false, noiseBuf = null, rain = null;

    master = AC.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = 0.15, slideTo = 0, delay = 0) {
  if (!AC) return;

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}

  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

// RULE: every character shows an expression while talking. The face reads the line being said
// (a line can also set its own mood with {say:1, ..., mood:'sad'}).
function talkExpr(def) {
  const d = G.dialog; if (!d) return def;
  if (d.src && d.src.mood) return d.src.mood;
  const t = d.en || '';
  if (/what\? what|got you|who is (making|talking)|right now|turn it off|go to your room|at this hour|whole neighbourhood|won't escape|talk in the morning/i.test(t)) return 'angry';
  if (/sorry|miss|alone|\baww|lost|used to|gone|never|sad/i.test(t)) return 'sad';
  if (/\bow\b|ouch|aaa|pinched|bumped|crow!|shh|caught/i.test(t)) return 'scared';
  if (/\bha\b|ha ha|hee|\bwon\b|\bwin\b|wow|got it|perfect|great|well done|bonked|yes!|my cap/i.test(t)) return 'grin';
  if (/hmm|i know you|suspicious|nobody/i.test(t)) return 'suspicious';
  if (/\?/.test(t)) return 'surprised';
  if (/!/.test(t)) return 'happy';
  return def;
}
function pupuExpr() {
  if (G.dialog && G.dialog.who === 'pupu') return talkExpr(P.sneak ? 'sneaky' : 'happy');
  if (G.state === 'caught' || G.state === 'ghurt') return 'scared';
  if (G.state === 'slide' || G.state === 'radio') return 'grin';
  if (P.drinkT > 0) return 'calm';
  if (P.sit && !(MA.visible && Math.abs(P.y - MA.y) < 200 && Math.abs(P.x - MA.x) < 650)) return P.sitT > 5 ? 'sleepy' : 'happy';
  if (G.state === 'cut') return MA.visible ? 'scared' : (G.tvOn ? 'grin' : 'happy');
  if (MA.visible && Math.abs(P.y - MA.y) < 200 && Math.abs(P.x - MA.x) < 650) return 'scared';
  if (MA.state === 'out') return 'surprised';
  if (P.hidden) return 'sneaky';
  if (P.sneak) return 'sneaky';
  return 'happy';
}
